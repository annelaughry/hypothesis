{% extends "core/base.html" %}

{% block title %}Curriculum{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1 class="mb-4">Curriculum Themes</h1>
  <p class="text-muted mb-4">
    Choose a theme to explore activities, lessons, and resources.
  </p>

  <div class="row">
    {% for theme in themes %}
      <div class="col-md-6 col-lg-4 mb-3">
        <a href="{% url 'curriculum:theme_detail' theme.slug %}"
           class="btn btn-primary w-100"
           style="white-space: normal;">
          {{ theme.name }}
        </a>
      </div>
    {% empty %}
      <p>No themes available yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
