{% extends "core/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Add Activity to "{{ program.name }}"</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Add Activity</button>
    <a href="{% url 'programs:program_detail' program.id %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
