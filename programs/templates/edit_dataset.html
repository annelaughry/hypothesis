{% extends "core/base.html" %}
{% block content %}
<div class="container py-4">
  <h2>Edit Dataset: {{ dataset.name }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ formset.management_form }}
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Data (as JSON)</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for form in formset %}
        <tr>
          <td>{{ form }}</td>
          <td>{{ form.DELETE }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <button type="submit" class="btn btn-success">💾 Save Changes</button>
    <a href="{% url 'programs:dataset_detail' dataset.id %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
