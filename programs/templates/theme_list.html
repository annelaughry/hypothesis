{% extends "core/base.html" %}
{% load static %}

{% block content %}
<style>
  .theme-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    margin-top: 20px;
  }

  .theme-card {
    position: relative;
    width: 280px;
    height: 180px;
    background-size: cover;
    background-position: center;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    display: flex;
    align-items: flex-end;
    padding: 15px;
    transition: transform 0.3s ease;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }

  .theme-card:hover {
    transform: scale(1.03);
  }

  .theme-name {
    color: white;
    font-weight: bold;
    font-size: 1.4rem;
    z-index: 2;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  }

  .theme-card.locked::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1;
  }

  .theme-card.locked .theme-name {
    filter: none;
  }

  .locked-overlay {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    color: white;
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 6px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .locked-overlay img {
    width: 16px;
    height: 16px;
  }
</style>

<div class="container">
  <h2 class="text-center mb-4">Select a Theme</h2>
  <div class="theme-grid">
    {% for theme in themes %}
      <a href="{% if not theme.locked %}{% url 'programs:programs_by_theme' theme.id %}{% else %}#{% endif %}"
         {% if theme.locked %}
         onclick="alert('Please complete the YSA Way Test to unlock this theme.'); return false;"
         {% endif %}
         class="theme-card {% if theme.locked %}locked{% endif %}"
         style="background-image: url('{{ theme.bg_url }}');">
         

        <div class="theme-name">{{ theme.name }}</div>

        {% if theme.locked %}
          <div class="locked-overlay">
            <img src="{% static 'images/lock_icon.png' %}" alt="Locked">
          </div>
        {% endif %}
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
